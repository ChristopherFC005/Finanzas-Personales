name: Keep Render API awake

# Render's free plan spins down a web service after ~15 minutes with no
# HTTP traffic; the next real visitor then waits 30-50s for a cold start.
# This pings the health endpoint every 10 minutes — under that threshold —
# so the free instance never fully sleeps. Free within GitHub Actions'
# included minutes (a few seconds per run, ~4,400 runs/month).
#
# This is a workaround, not a fix: it does not eliminate Render's monthly
# free-hour cap, and it stops helping the moment the plan is upgraded to
# one that doesn't spin down (at which point this workflow should be
# deleted, not left running for no reason).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://finanzen-api-xfw4.onrender.com/health)
          echo "health check -> $status"
          if [ "$status" != "200" ]; then
            echo "::warning::finanzen-api /health returned $status"
          fi
